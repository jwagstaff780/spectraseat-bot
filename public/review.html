<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave a review</title>
<meta name="description" content="Review your purchase.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/store.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="announce">Free tracked shipping on every order · 30-day returns · Secure checkout</div>
<header class="site"></header>
<main id="main">
<div class="wrap prose" id="root">
  <h1>Leave a review</h1>
  <p>Your honest opinion — good or bad — is published as written. We only remove contact details, links and abusive language.</p>
  <form id="form">
    <p><strong id="product-name"></strong></p>
    <div class="star-input" id="stars"><button type="button" data-v="1" aria-label="1 stars">★</button><button type="button" data-v="2" aria-label="2 stars">★</button><button type="button" data-v="3" aria-label="3 stars">★</button><button type="button" data-v="4" aria-label="4 stars">★</button><button type="button" data-v="5" aria-label="5 stars">★</button></div>
    <p><label>Your review<br><textarea id="body" rows="5" maxlength="2000" required></textarea></label></p>
    <p><label>Name shown (first name or initial)<br><input id="name" maxlength="40" style="font:inherit;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)"></label></p>
    <button class="btn">Submit review</button>
    <p class="error" id="error"></p>
  </form>
</div>
</main>
<footer class="site"></footer>
<script src="/js/store.js"></script>
<script>
Store.init();
  const params = new URLSearchParams(location.search);
  const token = params.get("t");
  const productId = Number(params.get("p"));
  let rating = 0;
  document.getElementById("stars").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-v]");
    if (!b) return;
    rating = Number(b.dataset.v);
    document.querySelectorAll("#stars button").forEach((x) => x.classList.toggle("on", Number(x.dataset.v) <= rating));
  });
  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = document.getElementById("error");
    if (!rating) return (err.textContent = "Please choose a star rating.");
    const res = await fetch("/api/shop/reviews", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, productId, rating, body: document.getElementById("body").value, name: document.getElementById("name").value }),
    });
    const out = await res.json();
    if (!res.ok) return (err.textContent = out.error || "Something went wrong.");
    document.getElementById("root").innerHTML = "<h1>Thank you!</h1><p>" +
      (out.held ? "Your review contained contact details or links, so it's been held back from publishing." : "Your review is now live.") +
      '</p><p><a class="btn" href="/">Back to the shop</a></p>';
  });
</script>
</body>
</html>
