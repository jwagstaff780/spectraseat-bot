<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/css/store.css">
<title>Shop</title>
<meta name="description" content="Comfort gear for the way you sit, work and play. Free tracked shipping.">
</head>
<body>
<header class="site"><div class="wrap"><a class="logo" href="/" data-brand></a><nav class="nav"><a href="/blog.html">Guides</a><button class="cart-btn" data-open-cart>Cart <b data-cart-count>0</b></button></nav></div></header>
<main class="wrap">
  <section class="hero">
    <h1 data-tagline></h1>
    <p>Hand-picked comfort essentials, tested for value, shipped free with tracking to your door.</p>
    <div class="trust"><span>✓ Free tracked shipping</span><span>✓ 30-day returns</span><span>✓ Secure checkout by Stripe</span></div>
  </section>
  <section class="grid" id="grid"><p class="empty">Loading…</p></section>
</main>
<footer class="site"><div class="wrap"><span>© <span data-year></span> <span data-brand></span></span><span><a href="/policies.html#shipping">Shipping</a> · <a href="/policies.html#returns">Returns</a> · <a href="/policies.html#privacy">Privacy</a> · <a data-support href="#"></a></span></div></footer>
<script src="/js/store.js"></script>
<script>
  Store.init();
  (async () => {
    const grid = document.getElementById("grid");
    try {
      const { products } = await (await fetch("/api/shop/products")).json();
      if (!products || !products.length) {
        grid.innerHTML = '<p class="empty">New products are on the way — check back soon.</p>';
        return;
      }
      grid.innerHTML = products.map((p) => `
        <a class="card" href="/product.html?slug=${encodeURIComponent(p.slug)}">
          <img src="${Store.esc(p.images[0] || "")}" alt="${Store.esc(p.title)}" loading="lazy">
          <div class="body"><h3>${Store.esc(p.title)}</h3>
          <div class="price">${Store.money(p.price)}${p.compareAtPrice ? `<s>${Store.money(p.compareAtPrice)}</s>` : ""}</div></div>
        </a>`).join("");
    } catch {
      grid.innerHTML = '<p class="empty">We couldn\'t load products right now. Please refresh.</p>';
    }
  })();
</script>
</body>
</html>
