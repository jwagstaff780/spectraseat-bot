name: Probe supplier API

# Manual check that the CJ API key works and that live responses match the
# field mapping in lib/supplier/cj.js. Needs repo secret CJ_API_KEY.
# Runs read-only calls only — never places an order.
on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "Search keyword"
        default: "seat cushion"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: node scripts/probe-supplier.js "${{ inputs.keyword }}"
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
