name: Probe Meta ads setup

# Manual, read-only check that the Meta token can see the ad account, Page,
# pixel and Instagram account the agents use. Never creates or spends.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: node scripts/probe-meta.js
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PIXEL_ID: ${{ secrets.META_PIXEL_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
